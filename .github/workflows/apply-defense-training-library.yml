          if 'lib-def-wu-1' not in text:
              text = text.replace(marker, marker.rstrip('\n') + ',\n' + additions)

          old = '    exerciseLibrary: normalizeLibraryEntries(readJson(STORAGE_KEYS.library, INITIAL_LIBRARY)),\n'
          new = '    exerciseLibrary: mergePlannerLibraryEntries(INITIAL_LIBRARY, readJson(STORAGE_KEYS.library, INITIAL_LIBRARY)),\n'
          if old in text:
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit library changes
        run: |
          if git diff --quiet -- coach-planner.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coach-planner.js
          git commit -m "Seed defense exercises in wrestling training planner"
          git push
